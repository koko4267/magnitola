<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: media:; media-src 'self' media: data:; font-src 'self'; connect-src https:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>MAGNItola</title>
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-BoldItalic.woff2') format('woff2');
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    :root {
      --font-main: "JetBrains Mono", monospace;
      --bg-main: #4c5844;
      --bg-header: #3b4435;
      --bg-dark: #282e22;
      --bg-panel: #242a20;
      --bg-input: #1c2219;
      --border-highlight: #6b7c61;
      --border-shadow: #1e2419;
      --border-light: #5d6d53;
      --border-dark: #171c14;
      --btn-bg: #4e5a46;
      --btn-hover: #586650;
      --btn-active: #384232;
      --text-main: #d0dcce;
      --text-bright: #ffffff;
      --text-muted: #8c9c86;
      --green-bar: #95c34e;
      --green-dark: #7aa53d;
      --accent-gold: #e2c174;
      --accent-red: #d15656;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 11px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
    }
    .main-pane {
      flex: 1;
      min-width: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .groupbox {
      border-top: 1px solid var(--border-highlight);
      border-left: 1px solid var(--border-highlight);
      border-right: 1px solid var(--border-shadow);
      border-bottom: 1px solid var(--border-shadow);
      padding: 10px;
      position: relative;
      background-color: var(--bg-main);
    }

    .groupbox-title {
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 11px;
      margin-bottom: 8px;
    }
    .btn {
      background-color: var(--btn-bg);
      color: var(--text-main);
      border-top: 1px solid var(--border-highlight);
      border-left: 1px solid var(--border-highlight);
      border-bottom: 1px solid var(--border-shadow);
      border-right: 1px solid var(--border-shadow);
      padding: 4px 12px;
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      white-space: nowrap;
      text-align: center;
    }

    #btnPaste {
      min-width: 82px;
    }

    #btnStartDownload {
      min-width: 90px;
    }

    #btnStopDownload {
      min-width: 60px;
    }

    #btnBrowseFolder {
      min-width: 76px;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--btn-hover);
      color: var(--text-bright);
    }

    .btn:active:not(:disabled) {
      border-top: 1px solid var(--border-shadow);
      border-left: 1px solid var(--border-shadow);
      border-bottom: 1px solid var(--border-highlight);
      border-right: 1px solid var(--border-highlight);
      background-color: var(--btn-active);
      color: var(--text-bright);
    }

    .btn:disabled {
      background-color: #384033;
      color: #636f5c;
      border-color: #434c3d;
      cursor: not-allowed;
    }

    .btn-primary {
      color: #ffffff;
      background-color: #55664c;
      border-top-color: #7b946d;
      border-left-color: #7b946d;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #617556;
    }

    .btn-sm {
      box-sizing: border-box;
      height: 26px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .input-text {
      background-color: var(--bg-input);
      color: var(--text-bright);
      border-top: 1px solid var(--border-dark);
      border-left: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      padding: 4px 8px;
      font-family: var(--font-main);
      font-size: 11px;
      height: 26px;
      width: 100%;
      user-select: text;
    }

    .input-text:focus {
      outline: 1px solid var(--green-bar);
    }

    .url-bar-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .download-card {
      display: flex;
      gap: 12px;
      padding: 10px;
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-dark);
      border-left: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
    }

    .album-art-box {
      width: 84px;
      height: 84px;
      min-width: 84px;
      background-color: #171c14;
      border: 1px solid var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .album-art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-art-placeholder-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-details-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .track-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 11px;
      color: var(--accent-gold);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-track {
      background-color: #171c14;
      height: 18px;
      border-top: 1px solid #11140e;
      border-left: 1px solid #11140e;
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        90deg,
        var(--green-bar) 0px,
        var(--green-bar) 7px,
        var(--green-dark) 7px,
        var(--green-dark) 9px
      );
      transition: none !important;
    }

    .progress-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 0px #000;
    }

    .download-stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-main);
    }
    .quote-box {
      margin-top: 6px;
      padding: 4px 8px;
      background-color: #21261d;
      border: 1px solid #1b2017;
      color: var(--accent-gold);
      font-style: italic;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bottom-controls-row {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .bottom-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .save-path-row {
      box-sizing: border-box;
      padding: 4px 8px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-shadow);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 280px;
      height: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save-path-row strong {
      color: var(--text-bright);
    }
    .syncline-widget {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-dark);
      border-left: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      padding: 2px 8px;
      height: 26px;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .syncline-widget:hover {
      background-color: #2e3629;
    }

    .syncline-widget:hover .syncline-text {
      color: var(--text-bright);
    }

    .syncline-logo-img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }

    .syncline-text {
      font-size: 11px;
      font-weight: bold;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }
    .single-lang-btn {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--btn-bg);
      border-top: 1px solid var(--border-highlight);
      border-left: 1px solid var(--border-highlight);
      border-bottom: 1px solid var(--border-shadow);
      border-right: 1px solid var(--border-shadow);
      color: var(--text-bright);
      padding: 2px 6px;
      height: 26px;
      width: 58px;
      min-width: 58px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }

    .single-lang-btn:hover {
      background-color: var(--btn-hover);
    }

    .single-lang-btn:active {
      border-top: 1px solid var(--border-shadow);
      border-left: 1px solid var(--border-shadow);
      border-bottom: 1px solid var(--border-highlight);
      border-right: 1px solid var(--border-highlight);
      background-color: var(--btn-active);
    }

    .flag-icon {
      width: 16px;
      height: 11px;
      display: block;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .player-sidebar {
      width: 320px;
      min-width: 300px;
      background-color: var(--bg-header);
      border-left: 2px solid var(--border-shadow);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .large-art-container {
      padding: 10px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .large-art-box {
      width: 170px;
      height: 170px;
      max-width: 100%;
      aspect-ratio: 1;
      background-color: #171c14;
      border-top: 1px solid var(--border-dark);
      border-left: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .large-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .large-art-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .large-art-placeholder-icon {
      font-size: 52px;
      color: var(--accent-gold);
      line-height: 1;
    }

    .large-art-placeholder-label {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .large-art-details {
      width: 100%;
      text-align: center;
      min-width: 0;
    }

    .large-art-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }

    .large-art-artist {
      font-size: 11px;
      color: var(--accent-gold);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .player-controls-panel {
      padding: 8px 10px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-shadow);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .player-buttons-row {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .playback-btn-group {
      display: flex;
      gap: 4px;
    }

    .playback-btn {
      width: 30px;
      height: 26px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .player-seek-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .seek-bar-track-wrapper {
      position: relative;
      height: 14px;
      background-color: #171c14;
      border-top: 1px solid #11140e;
      border-left: 1px solid #11140e;
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    .player-seek-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--green-bar);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .player-seek-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      margin: 0;
      padding: 0;
      pointer-events: none;
      z-index: 2;
    }

    .seek-time-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-main);
      font-size: 10px;
      color: var(--accent-gold);
    }
    .track-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: #1f251c;
    }

    .track-item-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 8px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-shadow);
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .track-item-row:hover {
      background-color: #313a2b;
    }

    .track-item-row.active {
      background-color: #3b4733;
      border-color: var(--accent-gold);
    }

    .track-item-art {
      width: 48px;
      height: 48px;
      min-width: 48px;
      background-color: #141812;
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .track-item-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-item-icon {
      color: var(--accent-gold);
      font-size: 22px;
    }

    .track-item-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .track-item-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    .track-item-row.active .track-item-title {
      color: var(--accent-gold);
    }

    .track-item-artist {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list-empty {
      padding: 30px 10px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
    }
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
      background-color: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--btn-bg);
      border-top: 1px solid var(--border-highlight);
      border-left: 1px solid var(--border-highlight);
      border-bottom: 1px solid var(--border-shadow);
      border-right: 1px solid var(--border-shadow);
    }

    ::-webkit-scrollbar-thumb:active {
      background-color: var(--btn-active);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="main-pane">
      <div class="groupbox">
        <div class="groupbox-title" id="lblUrlPrompt">Paste link:</div>
        <div class="url-bar-row">
          <input
            type="text"
            class="input-text"
            id="inputUrl"
            aria-label="SoundCloud URL"
            placeholder="Link to profile, track, playlist, album"
            spellcheck="false"
            autocomplete="off"
          />
          <button class="btn" id="btnPaste">Paste</button>
          <button class="btn btn-primary" id="btnStartDownload">Download</button>
          <button class="btn" id="btnStopDownload" disabled>Stop</button>
        </div>
      </div>
      <div class="groupbox" style="flex: 1; display: flex; flex-direction: column;">
        <div class="groupbox-title" id="lblCurrentStatus">Current download:</div>

        <div class="download-card">
          <div class="album-art-box" id="albumArtBox">
            <img id="albumArtIcon" class="album-art-placeholder-logo" src="magnitolalogo.jpg" alt="MAGNItola" />
            <img id="albumArtImg" src="" alt="Cover" style="display: none;" />
          </div>

          <div class="track-details-col">
            <div>
              <div class="track-title" id="currentTrackTitle">pls faster</div>
              <div class="track-artist" id="currentTrackArtist">MAGNItola</div>
            </div>
            <div>
              <div class="progress-track">
                <div class="progress-fill" id="trackProgressFill"></div>
                <div class="progress-text" id="trackProgressText">0%</div>
              </div>
              <div class="download-stats-row">
                <span id="downloadSizeStats">0.00 / 0.00 MB</span>
                <span id="downloadSpeedStats">0 KB/s</span>
                <span id="downloadCounterStats">Track 0 of 0</span>
              </div>
            </div>
            <div class="quote-box" id="quoteDisplay" style="display: none;">
              💬 «God invented computers»
            </div>
          </div>
        </div>
        <div class="bottom-controls-row">
          <a
            href="https://sync-line.pages.dev/"
            target="_blank"
            rel="noopener noreferrer"
            class="syncline-widget"
            title="Visit Syncline (https://sync-line.pages.dev/)"
          >
            <img src="synclinelogo.jpg" alt="Syncline Logo" class="syncline-logo-img" />
            <span class="syncline-text">try syncline</span>
          </a>

          <div class="bottom-right-group">
            <div style="display: flex; align-items: center; gap: 4px;">
              <div class="save-path-row" id="saveLocationInfo" title="Downloads">
                Save folder: <strong id="saveFolderPath">Downloads</strong>
              </div>
              <button class="btn btn-sm" id="btnBrowseFolder" title="Browse...">Browse...</button>
            </div>

            <button class="single-lang-btn" id="btnToggleLang" aria-label="Switch language / Сменить язык" title="Switch language / Сменить язык">
              <img class="flag-icon" id="flagImg" src="us.png" alt="Flag" />
              <span id="langLabel">EN</span>
            </button>
          </div>
        </div>

      </div>

    </div>
    <div class="player-sidebar">
      <div class="large-art-container" id="playerLargeArtContainer" style="display: none;">
        <div class="large-art-box">
          <img id="playerLargeArtImg" src="" alt="Album Art" class="large-art-img" style="display: none;" />
          <div id="playerLargeArtPlaceholder" class="large-art-placeholder">
            <span class="large-art-placeholder-icon">♫</span>
            <span class="large-art-placeholder-label">NO ARTWORK</span>
          </div>
        </div>
        <div class="large-art-details">
          <div class="large-art-title" id="playerLargeArtTitle">-</div>
          <div class="large-art-artist" id="playerLargeArtArtist">-</div>
        </div>
      </div>
      <div class="player-controls-panel">
        <div class="player-buttons-row">
          <div class="playback-btn-group">
            <button class="btn playback-btn" id="btnPlayerPrev" aria-label="Previous track" title="Previous track" disabled>|◀</button>
            <button class="btn btn-primary playback-btn" id="btnPlayerPlay" aria-label="Play or pause" title="Play" disabled>▶</button>
            <button class="btn playback-btn" id="btnPlayerNext" aria-label="Next track" title="Next track" disabled>▶|</button>
          </div>
        </div>

        <div class="player-seek-container">
          <div class="seek-bar-track-wrapper" id="playerSeekWrapper">
            <div class="player-seek-fill" id="playerSeekFill" style="width: 0%;"></div>
            <input
              type="range"
              class="player-seek-input"
              id="playerSeekInput"
              aria-label="Playback seek"
              min="0"
              max="1"

    function createId3v23Tag(title, artist, artworkBuffer) {
      function makeTextFrame(frameId, text) {
        if (!text) return null;
        const bytes = [0x01, 0xFF, 0xFE]; 
        for (let i = 0; i < text.length; i++) {
          const code = text.charCodeAt(i);
          bytes.push(code & 0xFF, (code >> 8) & 0xFF);
        }
        const body = new Uint8Array(bytes);
        const frame = new Uint8Array(10 + body.length);
        for (let i = 0; i < 4; i++) frame[i] = frameId.charCodeAt(i);
        const sz = body.length;
        frame[4] = (sz >> 24) & 0xFF;
        frame[5] = (sz >> 16) & 0xFF;
        frame[6] = (sz >> 8) & 0xFF;
        frame[7] = sz & 0xFF;
        frame[8] = 0x00;
        frame[9] = 0x00;
        frame.set(body, 10);
        return frame;
      }

      function makeApicFrame(imgBytes) {
        if (!imgBytes || imgBytes.length === 0) return null;
        const mime = "image/jpeg\0";
        const mimeBytes = [];
        for (let i = 0; i < mime.length; i++) mimeBytes.push(mime.charCodeAt(i));

        const bodyLen = 1 + mimeBytes.length + 1 + 1 + imgBytes.length;
        const body = new Uint8Array(bodyLen);
        let p = 0;
        body[p++] = 0x00; 
        for (let b of mimeBytes) body[p++] = b;
        body[p++] = 0x03;
        body[p++] = 0x00;
        body.set(imgBytes, p);

        const frame = new Uint8Array(10 + bodyLen);
        for (let i = 0; i < 4; i++) frame[i] = "APIC".charCodeAt(i);
        frame[4] = (bodyLen >> 24) & 0xFF;
        frame[5] = (bodyLen >> 16) & 0xFF;
        frame[6] = (bodyLen >> 8) & 0xFF;
        frame[7] = bodyLen & 0xFF;
        frame[8] = 0x00;
        frame[9] = 0x00;
        frame.set(body, 10);
        return frame;
      }

      const frames = [];
      const tit2 = makeTextFrame("TIT2", title);
      const tpe1 = makeTextFrame("TPE1", artist);
      if (tit2) frames.push(tit2);
      if (tpe1) frames.push(tpe1);
      if (artworkBuffer) {
        const apic = makeApicFrame(artworkBuffer);
        if (apic) frames.push(apic);
      }

      const totalFramesSize = frames.reduce((acc, f) => acc + f.length, 0);
      const header = new Uint8Array(10);
      header[0] = 0x49; header[1] = 0x44; header[2] = 0x33; 
      header[3] = 0x03; header[4] = 0x00; 
      header[5] = 0x00;
      header[6] = (totalFramesSize >> 21) & 0x7F;
      header[7] = (totalFramesSize >> 14) & 0x7F;
      header[8] = (totalFramesSize >> 7) & 0x7F;
      header[9] = totalFramesSize & 0x7F;

      const tag = new Uint8Array(10 + totalFramesSize);
      tag.set(header, 0);
      let offset = 10;
      for (const f of frames) {
        tag.set(f, offset);
        offset += f.length;
      }
      return tag;
    }

    function sanitizeFolderName(name) {

      let clean = name.replace(/[<>:"/\\|?*]+/g, '_').replace(/[\x00-\x1f]/g, '').trim().replace(/\.+$/, '');
      const reserved = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;

    function bufferToDataUrl(buf, mimeType = 'image/jpeg') {
      let binary = '';
      const len = buf.byteLength;
      const chunkSize = 0x8000;
      for (let i = 0; i < len; i += chunkSize) {
        const sub = buf.subarray(i, Math.min(i + chunkSize, len));
        binary += String.fromCharCode.apply(null, sub);
      }
      return `data:${mimeType};base64,${btoa(binary)}`;
    }

    async function encodeAudioBufferToMp3(audioBuffer, bitrate = 192, onProgress = null) {
      const lame = window.lamejs || (typeof lamejs !== 'undefined' ? lamejs : null);
      if (!lame?.Mp3Encoder) {
        throw new Error('MP3 encoder not initialized');
      }

      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lame.Mp3Encoder(channels, sampleRate, bitrate);

      const samplesLeft = audioBuffer.getChannelData(0);
      const samplesRight = channels > 1 ? audioBuffer.getChannelData(1) : samplesLeft;
      const numSamples = samplesLeft.length;

      const sampleBlockSize = 1152;
      const mp3Chunks = [];
      let lastYield = Date.now();

      for (let i = 0; i < numSamples; i += sampleBlockSize) {
        if (cancelRequested) {
          throw new Error('Encoding cancelled');
        }

        const blockSize = Math.min(sampleBlockSize, numSamples - i);
        const leftChunk = new Int16Array(blockSize);
        const rightChunk = channels > 1 ? new Int16Array(blockSize) : leftChunk;

        for (let j = 0; j < blockSize; j++) {
          let sL = Math.max(-1, Math.min(1, samplesLeft[i + j]));
          leftChunk[j] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
          if (channels > 1) {
            let sR = Math.max(-1, Math.min(1, samplesRight[i + j]));
            rightChunk[j] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
          }
        }

        const mp3buf = channels === 1
          ? mp3encoder.encodeBuffer(leftChunk)
          : mp3encoder.encodeBuffer(leftChunk, rightChunk);

        if (mp3buf && mp3buf.length > 0) {
          mp3Chunks.push(new Uint8Array(mp3buf));
        }

        if (Date.now() - lastYield > 40) {
          if (onProgress) {
            onProgress(i / numSamples);
          }
          await new Promise(r => setTimeout(r, 0));
          lastYield = Date.now();
        }
      }

      if (onProgress) {
        onProgress(1.0);
      }

      const finalChunk = mp3encoder.flush();
      if (finalChunk && finalChunk.length > 0) {
        mp3Chunks.push(new Uint8Array(finalChunk));
      }

      let totalLen = 0;
      for (const c of mp3Chunks) totalLen += c.length;
      const result = new Uint8Array(totalLen);
      let offset = 0;
      for (const chunk of mp3Chunks) {
        result.set(chunk, offset);
        offset += chunk.length;
      }
      return result;
    }

    async function resolveSoundCloudUrl(url) {
      let cleanUrl = url.trim();

      if (cleanUrl.includes('on.soundcloud.com')) {
        try {
          const resp = await fetch(cleanUrl, { method: 'GET', redirect: 'follow' });
          if (resp.url && resp.url !== cleanUrl) {
            cleanUrl = resp.url;
          }
        } catch (e) {
          console.warn('Could not expand shortlink:', e);
        }
      }

      let resolveTarget = cleanUrl.replace(/\/likes\/?(\?.*)?$/i, '').replace(/\/+$/, '');
      const resolveApi = `https://api-v2.soundcloud.com/resolve?url=${encodeURIComponent(resolveTarget)}&client_id=${clientId}`;

      const resp = await fetch(resolveApi);
      if (!resp.ok) {
        throw new Error(`SoundCloud resolve failed with status ${resp.status}`);
      }

      const data = await resp.json();
      const kind = data.kind;
      let trackQueue = [];
      let subFolder = null;

      if (kind === 'track') {
        trackQueue = [data];
        subFolder = null;
      } else if (kind === 'playlist' || kind === 'system-playlist') {
        const title = (data.title || '').trim();
        subFolder = sanitizeFolderName(title) || (data.set_type === 'album' ? 'Album' : 'Playlist');
        const tracksElement = data.tracks || [];
        const trackIdsToFetch = [];

        for (const item of tracksElement) {
          if (item.media && item.media.transcodings) {
            trackQueue.push(item);
          } else if (item.id) {
            trackIdsToFetch.push(item.id);
          }
        }

        if (trackIdsToFetch.length > 0) {
          for (let i = 0; i < trackIdsToFetch.length; i += 50) {
            if (cancelRequested) break;
            const batch = trackIdsToFetch.slice(i, i + 50);
            const batchUrl = `https://api-v2.soundcloud.com/tracks?ids=${batch.join('%2C')}&client_id=${clientId}`;
            const bResp = await fetch(batchUrl);
            if (bResp.ok) {
              const bTracks = await bResp.json();
              trackQueue.push(...bTracks);
            }
          }
        }
      } else if (kind === 'user') {
        subFolder = 'Likes';
        const userId = data.id;
        let likesUrl = `https://api-v2.soundcloud.com/users/${userId}/likes?client_id=${clientId}&limit=50`;

        while (likesUrl && !cancelRequested) {
          const lResp = await fetch(likesUrl);
          if (!lResp.ok) break;
          const lData = await lResp.json();

          for (const item of (lData.collection || [])) {
            if (item.track && item.track.media && item.track.media.transcodings) {
              trackQueue.push(item.track);
            } else if (item.playlist && item.playlist.tracks) {
              for (const ptr of item.playlist.tracks) {
                if (ptr && ptr.media && ptr.media.transcodings) {
                  trackQueue.push(ptr);
                }
              }
            } else if (item.media && item.media.transcodings) {
              trackQueue.push(item);
            }
          }

          if (lData.next_href) {
            likesUrl = lData.next_href;
            if (!likesUrl.includes('client_id=')) {
              likesUrl += `&client_id=${clientId}`;
            }
          } else {
            likesUrl = null;
          }
        }
      } else {
        throw new Error(L.invalidUrlError);
      }

      return {
        tracks: trackQueue,
        subFolder: subFolder,
        kind: kind,
        title: data.title || null
      };
    }

    async function downloadTrack(track, index, total, subFolder = null) {
      const title = track.title || 'Untitled';
      const artist = track.user ? (track.user.username || 'Unknown Artist') : 'MAGNItola';
      const artwork = track.artwork_url || (track.user ? track.user.avatar_url : null);
      const fileName = `${sanitizeFileName(artist)} - ${sanitizeFileName(title)}.mp3`;

      setDownloadProgress(0);
      currentTrackTitle.textContent = title;
      currentTrackArtist.textContent = artist;

      const hiResArtwork = getCoverArtUrl(artwork);
      if (hiResArtwork) {
        albumArtImg.src = hiResArtwork;
        albumArtImg.style.display = 'block';
        albumArtIcon.style.display = 'none';
      } else {
        albumArtImg.style.display = 'none';
        albumArtIcon.style.display = 'block';
      }

      if (api?.checkFileExists) {
        const targetDir = downloadFolder || (await api.getDefaultDownloadsFolder());
        const check = await api.checkFileExists({ folder: targetDir, subFolder, fileName });
        if (check?.exists) {
          lblCurrentStatus.textContent = `${L.currentStatus || 'Current download:'} ${L.alreadyExists || 'Already exists'}`;
          setDownloadProgress(100);
          downloadSpeedStats.textContent = 'SKIP';
          downloadSizeStats.textContent = '-- / -- MB';
          await new Promise(r => setTimeout(r, 150));
          return true;
        }
      }

      try {
        const transcodings = track.media && track.media.transcodings ? track.media.transcodings : [];
        if (transcodings.length === 0) return false;

        const sorted = [...transcodings].sort((a, b) => {
          let scoreA = 0, scoreB = 0;
          if (a.format?.protocol === 'progressive' && a.format?.mime_type === 'audio/mpeg') scoreA += 500;
          if (b.format?.protocol === 'progressive' && b.format?.mime_type === 'audio/mpeg') scoreB += 500;
          if (a.preset === 'aac_160k') scoreA += 300;
          if (b.preset === 'aac_160k') scoreB += 300;
          if (a.preset === 'aac_96k') scoreA += 200;
          if (b.preset === 'aac_96k') scoreB += 200;
          if (a.format?.mime_type?.includes('mp4') || a.format?.mime_type?.includes('aac')) scoreA += 100;
          if (b.format?.mime_type?.includes('mp4') || b.format?.mime_type?.includes('aac')) scoreB += 100;
          return scoreB - scoreA;
        });

        let audioBuffer = null;

        for (const selected of sorted) {
          if (cancelRequested) return false;

          let streamInfoUrl = `${selected.url}?client_id=${clientId}`;
          if (track.track_authorization) {
            streamInfoUrl += `&track_authorization=${encodeURIComponent(track.track_authorization)}`;
          }

          const streamResp = await fetch(streamInfoUrl);
          if (!streamResp.ok) continue;
          const streamJson = await streamResp.json();
          const audioCdnUrl = streamJson.url;
          if (!audioCdnUrl) continue;

          if (selected.format?.protocol === 'progressive' || !audioCdnUrl.includes('.m3u8')) {
            const audioResp = await fetch(audioCdnUrl);
            if (!audioResp.ok) continue;

            const contentLength = +audioResp.headers.get('Content-Length') || 0;
            const reader = audioResp.body.getReader();
            let receivedBytes = 0;
            const chunks = [];
            const startTime = Date.now();

            while (true) {
              if (cancelRequested) {
                await reader.cancel();
                return false;
              }

              const { done, value } = await reader.read();
              if (done) break;

              chunks.push(value);
              receivedBytes += value.length;

              const willEncode = !(selected.format?.protocol === 'progressive' && selected.format?.mime_type === 'audio/mpeg');
              const rawPercent = contentLength > 0 ? (receivedBytes / contentLength * 100) : 0;
              const displayPct = willEncode ? rawPercent * 0.7 : rawPercent;
              setDownloadProgress(displayPct);

              const curMb = (receivedBytes / 1024 / 1024).toFixed(2);
              const totalMb = contentLength > 0 ? (contentLength / 1024 / 1024).toFixed(2) : '?';
              downloadSizeStats.textContent = `${curMb} / ${totalMb} MB`;

              const elapsedSec = (Date.now() - startTime) / 1000;
              if (elapsedSec > 0) {
                const kbSec = ((receivedBytes / 1024) / elapsedSec).toFixed(0);
                downloadSpeedStats.textContent = `${kbSec} KB/s`;
              }
            }

            audioBuffer = new Uint8Array(receivedBytes);
            let offset = 0;
            for (const chunk of chunks) {
              audioBuffer.set(chunk, offset);
              offset += chunk.length;
            }
            break;
          } else {
            const hlsResp = await fetch(audioCdnUrl);
            if (!hlsResp.ok) continue;
            let m3u8Text = await hlsResp.text();

            let targetPlaylistUrl = audioCdnUrl;
            if (m3u8Text.includes('#EXT-X-STREAM-INF')) {
              const lines = m3u8Text.split('\n');
              for (let li = 0; li < lines.length; li++) {
                if (lines[li].startsWith('#EXT-X-STREAM-INF')) {
                  const nextLine = lines[li + 1]?.trim();
                  if (nextLine && !nextLine.startsWith('#')) {
                    targetPlaylistUrl = new URL(nextLine, audioCdnUrl).href;
                    break;
                  }
                }
              }
              const varResp = await fetch(targetPlaylistUrl);
              if (varResp.ok) m3u8Text = await varResp.text();
            }

            const mapMatch = /#EXT-X-MAP:URI="([^"]+)"/i.exec(m3u8Text);
            const initUrl = mapMatch ? new URL(mapMatch[1], targetPlaylistUrl).href : null;

            const segmentUrls = [];
            for (const line of m3u8Text.split('\n')) {
              const tr = line.trim();
              if (tr && !tr.startsWith('#')) {
                segmentUrls.push(new URL(tr, targetPlaylistUrl).href);
              }
            }

            if (segmentUrls.length === 0) continue;

            const totalSegments = segmentUrls.length;
            const segBuffers = new Array(totalSegments);
            let downloadedCount = 0;
            let receivedBytes = 0;
            const startTime = Date.now();

            let initBuf = null;
            if (initUrl) {
              try {
                const initResp = await fetch(initUrl);
                if (initResp.ok) {
                  initBuf = new Uint8Array(await initResp.arrayBuffer());
                  receivedBytes += initBuf.length;
                }
              } catch (e) {
                console.warn('HLS init segment fetch error:', e);
              }
            }

            const concurrency = 6;
            let nextIndex = 0;
            let hasError = false;

            async function segmentWorker() {
              while (nextIndex < totalSegments && !cancelRequested && !hasError) {
                const sIdx = nextIndex++;
                try {
                  const segResp = await fetch(segmentUrls[sIdx]);
                  if (!segResp.ok) throw new Error(`HTTP ${segResp.status}`);
                  const segBuf = new Uint8Array(await segResp.arrayBuffer());
                  segBuffers[sIdx] = segBuf;
                  downloadedCount++;
                  receivedBytes += segBuf.length;

                  const rawPercent = (downloadedCount / totalSegments) * 100;
                  const displayPct = rawPercent * 0.7;
                  setDownloadProgress(displayPct);

                  const curMb = (receivedBytes / 1024 / 1024).toFixed(2);
                  downloadSizeStats.textContent = `${curMb} MB`;

                  const elapsedSec = (Date.now() - startTime) / 1000;
                  if (elapsedSec > 0) {
                    const kbSec = ((receivedBytes / 1024) / elapsedSec).toFixed(0);
                    downloadSpeedStats.textContent = `${kbSec} KB/s`;
                  }
                } catch (err) {
                  console.warn(`Segment ${sIdx} fetch failed:`, err);
                  hasError = true;
                }
              }
            }

            const poolWorkers = [];
            const workerCount = Math.min(concurrency, totalSegments);
            for (let w = 0; w < workerCount; w++) {
              poolWorkers.push(segmentWorker());
            }

            await Promise.all(poolWorkers);
            if (cancelRequested || hasError || downloadedCount < totalSegments) continue;

            const chunks = [];
            if (initBuf) chunks.push(initBuf);
            for (const b of segBuffers) {
              if (b) chunks.push(b);
            }

            let totalLen = 0;
            for (const c of chunks) totalLen += c.length;
            audioBuffer = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) {
              audioBuffer.set(chunk, offset);
              offset += chunk.length;
            }
            break;
          }
        }

        if (!audioBuffer) return false;

        let artworkBuffer = null;
        let artworkBase64 = null;
        if (hiResArtwork) {
          try {
            const coverResp = await fetch(hiResArtwork);
            if (coverResp.ok) {
              const cBuf = await coverResp.arrayBuffer();
              artworkBuffer = new Uint8Array(cBuf);
              artworkBase64 = bufferToDataUrl(artworkBuffer, 'image/jpeg');
            }
          } catch {}
        }

        let cleanMp3Audio = null;
        const isDirectMp3 = audioBuffer.length > 4 &&
          ((audioBuffer[0] === 0xFF && (audioBuffer[1] & 0xE0) === 0xE0) ||
           (audioBuffer[0] === 0x49 && audioBuffer[1] === 0x44 && audioBuffer[2] === 0x33));

        if (isDirectMp3) {
          cleanMp3Audio = audioBuffer;
          setDownloadProgress(100);
        } else {
          lblCurrentStatus.textContent = `${L.currentStatus || 'Current download:'} ${L.encoding || 'Encoding MP3...'}`;
          setDownloadProgress(70);
          downloadSpeedStats.textContent = 'MP3 192k';

          const actx = new (window.AudioContext || window.webkitAudioContext)();
          try {
            const abCopy = audioBuffer.buffer.slice(audioBuffer.byteOffset, audioBuffer.byteOffset + audioBuffer.byteLength);
            const decodedPcm = await actx.decodeAudioData(abCopy);
            cleanMp3Audio = await encodeAudioBufferToMp3(decodedPcm, 192, (ratio) => {
              const combinedPct = 70 + (ratio * 30);
              setDownloadProgress(combinedPct);
            });
          } finally {
            if (actx && actx.close) actx.close().catch(() => {});
          }
          setDownloadProgress(100);
        }

        if (!cleanMp3Audio) return false;

        const id3Tag = createId3v23Tag(title, artist, artworkBuffer);
        const combined = new Uint8Array(id3Tag.length + cleanMp3Audio.length);
        combined.set(id3Tag, 0);
        combined.set(cleanMp3Audio, id3Tag.length);

        if (api?.saveTrack) {
          const targetDir = downloadFolder || (await api.getDefaultDownloadsFolder());
          const saveRes = await api.saveTrack({
            folder: targetDir,
            subFolder,
            fileName,
            buffer: combined
          });

          if (saveRes?.success) {
            addTrackToPlayer({
              id: saveRes.filePath,
              filePath: saveRes.filePath,
              fileName,
              title,
              artist,
              artworkDataUrl: artworkBase64,
              duration: Math.round(track.duration ? track.duration / 1000 : 0)
            });
          }
        }

        setDownloadProgress(100);
        return true;

      } catch (err) {
        console.error('Download error for track:', err && err.message ? err.message : err, err);
        return false;
      }
    }

    async function startDownloadFlow() {
      const rawUrl = inputUrl.value.trim();
      if (!rawUrl) {
        alert(L.emptyUrlError);
        return;
      }

      isDownloading = true;
      cancelRequested = false;
      btnStartDownload.disabled = true;
      btnStopDownload.disabled = false;
      startQuoteRotation();

      currentTrackTitle.textContent = L.resolvingUrl;
      currentTrackArtist.textContent = "MAGNItola";

      try {
        const result = await resolveSoundCloudUrl(rawUrl);
        const queue = result ? result.tracks : [];
        const subFolder = result ? result.subFolder : null;

        if (!queue || queue.length === 0) {
          alert(L.noTracksFound);
          return;
        }

        const targetDir = downloadFolder || (api?.getDefaultDownloadsFolder ? await api.getDefaultDownloadsFolder() : null);
        if (subFolder && api?.ensureFolder && targetDir) {
          await api.ensureFolder({ folder: targetDir, subFolder });
          lblCurrentStatus.textContent = (L.currentStatus || 'Current download:') + ' [' + subFolder + ']';
        }

        const total = queue.length;
        let completed = 0;

        for (let i = 0; i < total; i++) {
          if (cancelRequested) break;
          downloadCounterStats.textContent = `${L.trackPrefix} ${i + 1} ${L.fromWord} ${total}`;
          const ok = await downloadTrack(queue[i], i + 1, total, subFolder);
          if (ok) completed++;
        }

        currentTrackTitle.textContent = `${L.finished} (${completed}/${total})`;
      } catch (err) {
        console.error(err);
        alert(err.message || L.failed);
      } finally {
        isDownloading = false;
        btnStartDownload.disabled = false;
        btnStopDownload.disabled = true;
        lblCurrentStatus.textContent = L.currentStatus;
        stopQuoteRotation();
        checkQuoteVisibility();
      }
    }

    const audio = new Audio();
    audio.volume = 1.0;

    let libraryTracks = [];
    let currentPlayingTrack = null;
    let isPlaying = false;
    let isDraggingSeek = false;

    function getMediaUrl(filePath) {
      return `media://local/${encodeURIComponent(filePath)}`;
    }

    function addTrackToPlayer(track) {
      const existingIdx = libraryTracks.findIndex(t => t.filePath.toLowerCase() === track.filePath.toLowerCase());
      if (existingIdx !== -1) {
        libraryTracks[existingIdx] = track;
      } else {
        libraryTracks.unshift(track);
      }
      renderTrackList();
      updatePlayerButtonsState();
    }

    async function scanAndLoadLibrary(folder) {
      if (!api?.scanLibrary || !folder) return;
      try {
        const tracks = await api.scanLibrary(folder);
        libraryTracks = tracks || [];
        renderTrackList();
        updatePlayerButtonsState();
      } catch (err) {
        console.error('Scan library error:', err);
      }
    }

    function renderTrackList() {
      if (libraryTracks.length === 0) {
        playerTrackList.innerHTML = `<div class="track-list-empty" id="playerTrackListEmpty"><p>${escapeHtml(L.noTracksInFolder)}</p></div>`;
        return;
      }

      let html = '';
      for (let i = 0; i < libraryTracks.length; i++) {
        const tr = libraryTracks[i];
        const isActive = currentPlayingTrack && currentPlayingTrack.filePath === tr.filePath;
        const safeTitle = escapeHtml(tr.title);
        const safeArtist = escapeHtml(tr.artist);
        const safeArt = tr.artworkDataUrl ? escapeHtml(tr.artworkDataUrl) : null;

        html += `
          <div class="track-item-row ${isActive ? 'active' : ''}" data-index="${i}">
            <div class="track-item-art">
              ${safeArt ? `<img src="${safeArt}" alt="Cover" />` : `<span class="track-item-icon">♫</span>`}
            </div>
            <div class="track-item-meta">
              <div class="track-item-title">${safeTitle}</div>
              <div class="track-item-artist">${safeArtist}</div>
            </div>
          </div>
        `;
      }
      playerTrackList.innerHTML = html;

      const rows = playerTrackList.querySelectorAll('.track-item-row');
      rows.forEach(r => {
        r.addEventListener('click', () => {
          const idx = parseInt(r.getAttribute('data-index'), 10);
          playTrack(libraryTracks[idx]);
        });
      });
    }

    function updatePlayerButtonsState() {
      const hasTracks = libraryTracks.length > 0;
      btnPlayerPrev.disabled = !hasTracks;
      btnPlayerPlay.disabled = !hasTracks;
      btnPlayerNext.disabled = !hasTracks;
    }

    function playTrack(track) {
      if (!track) return;
      currentPlayingTrack = track;

      playerLargeArtContainer.style.display = 'flex';
      playerLargeArtTitle.textContent = track.title;
      playerLargeArtArtist.textContent = track.artist;

      if (track.artworkDataUrl) {
        playerLargeArtImg.src = track.artworkDataUrl;
        playerLargeArtImg.style.display = 'block';
        playerLargeArtPlaceholder.style.display = 'none';
      } else {
        playerLargeArtImg.style.display = 'none';
        playerLargeArtPlaceholder.style.display = 'flex';
      }

      audio.src = getMediaUrl(track.filePath);
      audio.play().catch(e => console.warn('Playback start warning:', e));
      isPlaying = true;
      btnPlayerPlay.textContent = '❚❚';
      btnPlayerPlay.title = L.paused;
      playerSeekInput.disabled = false;
      playerSeekFill.style.width = '0%';
      playerCurrentTime.textContent = '0:00';
      playerTotalTime.textContent = (track.duration && track.duration > 0) ? formatTime(track.duration) : '0:00';
      if (track.duration && track.duration > 0) {
        playerSeekInput.max = track.duration;
      }
      renderTrackList();
    }

    function togglePlay() {
      if (!currentPlayingTrack && libraryTracks.length > 0) {
        playTrack(libraryTracks[0]);
        return;
      }
      if (!currentPlayingTrack) return;

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        btnPlayerPlay.textContent = '▶';
        btnPlayerPlay.title = L.playing;
      } else {
        audio.play().catch(e => console.warn(e));
        isPlaying = true;
        btnPlayerPlay.textContent = '❚❚';
        btnPlayerPlay.title = L.paused;
      }
      renderTrackList();
    }

    function prevTrack() {
      if (libraryTracks.length === 0) return;
      if (!currentPlayingTrack) {
        playTrack(libraryTracks[0]);
        return;
      }
      const idx = libraryTracks.findIndex(t => t.filePath === currentPlayingTrack.filePath);
      const nextIdx = idx > 0 ? idx - 1 : libraryTracks.length - 1;
      playTrack(libraryTracks[nextIdx]);
    }

    function nextTrack() {
      if (libraryTracks.length === 0) return;
      if (!currentPlayingTrack) {
        playTrack(libraryTracks[0]);
        return;
      }
      const idx = libraryTracks.findIndex(t => t.filePath === currentPlayingTrack.filePath);
      const nextIdx = (idx + 1) % libraryTracks.length;
      playTrack(libraryTracks[nextIdx]);
    }

    btnPlayerPlay.addEventListener('click', togglePlay);
    btnPlayerPrev.addEventListener('click', prevTrack);
    btnPlayerNext.addEventListener('click', nextTrack);

    audio.addEventListener('play', () => {
      isPlaying = true;
      btnPlayerPlay.textContent = '❚❚';
      renderTrackList();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      btnPlayerPlay.textContent = '▶';
      renderTrackList();
    });

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    function updateDurationDisplay() {
      const dur = audio.duration;
      if (dur && Number.isFinite(dur) && dur > 0) {
        playerSeekInput.max = dur;
        playerTotalTime.textContent = formatTime(dur);
      }
    }

    audio.addEventListener('loadedmetadata', updateDurationDisplay);
    audio.addEventListener('durationchange', updateDurationDisplay);
    audio.addEventListener('canplay', updateDurationDisplay);

    audio.addEventListener('timeupdate', () => {
      if (!isDraggingSeek) {
        const cur = audio.currentTime;
        const dur = audio.duration;
        if (dur && Number.isFinite(dur) && dur > 0) {
          playerSeekInput.max = dur;
          playerSeekInput.value = cur;
          const pct = Math.min(100, Math.max(0, (cur / dur) * 100));
          playerSeekFill.style.width = `${pct}%`;
          playerCurrentTime.textContent = formatTime(cur);
          playerTotalTime.textContent = formatTime(dur);
        } else {
          playerCurrentTime.textContent = formatTime(cur);
        }
      }
    });

    let isPointerDownOnSeek = false;

    function getSeekRatioFromEvent(e) {
      const rect = playerSeekWrapper.getBoundingClientRect();
      if (rect.width <= 0) return 0;
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    }

    function previewSeekPosition(ratio) {
      const dur = audio.duration;
      const validDur = (dur && Number.isFinite(dur) && dur > 0) ? dur : (currentPlayingTrack?.duration || 0);
      const clampedRatio = Math.max(0, Math.min(1, ratio));
      playerSeekFill.style.width = `${clampedRatio * 100}%`;
      if (validDur > 0) {
        const targetSec = clampedRatio * validDur;
        playerSeekInput.value = targetSec;
        playerCurrentTime.textContent = formatTime(targetSec);
      }
    }

    function applySeekPosition(ratio) {
      const dur = audio.duration;
      const validDur = (dur && Number.isFinite(dur) && dur > 0) ? dur : (currentPlayingTrack?.duration || 0);
      if (validDur > 0) {
        const clampedRatio = Math.max(0, Math.min(1, ratio));
        const targetSec = clampedRatio * validDur;
        playerSeekFill.style.width = `${clampedRatio * 100}%`;
        playerSeekInput.value = targetSec;
        playerCurrentTime.textContent = formatTime(targetSec);
        try {
          audio.currentTime = targetSec;
        } catch (err) {
          console.warn('Seek error:', err);
        }
      }
    }

    playerSeekWrapper.addEventListener('pointerdown', (e) => {
      if (playerSeekInput.disabled || !currentPlayingTrack) return;
      isDraggingSeek = true;
      isPointerDownOnSeek = true;
      try {
        playerSeekWrapper.setPointerCapture(e.pointerId);
      } catch (err) {}
      const ratio = getSeekRatioFromEvent(e);
      previewSeekPosition(ratio);
    });

    playerSeekWrapper.addEventListener('pointermove', (e) => {
      if (!isPointerDownOnSeek) return;
      const ratio = getSeekRatioFromEvent(e);
      previewSeekPosition(ratio);
    });

    function finishSeekPointer(e) {
      if (!isPointerDownOnSeek) return;
      isPointerDownOnSeek = false;
      isDraggingSeek = false;
      const ratio = getSeekRatioFromEvent(e);
      applySeekPosition(ratio);
    }

    playerSeekWrapper.addEventListener('pointerup', finishSeekPointer);
    playerSeekWrapper.addEventListener('pointercancel', finishSeekPointer);

    playerSeekInput.addEventListener('input', (e) => {
      isDraggingSeek = true;
      const val = parseFloat(e.target.value);
      const dur = audio.duration || 1;
      const pct = (val / dur) * 100;
      playerSeekFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      playerCurrentTime.textContent = formatTime(val);
    });

    playerSeekInput.addEventListener('change', (e) => {
      isDraggingSeek = false;
      const val = parseFloat(e.target.value);
      if (Number.isFinite(val) && audio.duration) {
        audio.currentTime = val;
      }
    });

    btnPaste.addEventListener('click', async () => {
      try {
        const text = api?.readClipboard ? await api.readClipboard() : '';
        if (text) {
          inputUrl.value = text;
          checkQuoteVisibility();
        }
      } catch {
        inputUrl.focus();
      }
    });

    inputUrl.addEventListener('input', () => {
      checkQuoteVisibility();
    });

    inputUrl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        startDownloadFlow();
      }
    });

    btnStartDownload.addEventListener('click', startDownloadFlow);
    btnStopDownload.addEventListener('click', () => {
      cancelRequested = true;
      btnStopDownload.disabled = true;
    });

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      updateSavePathDisplay();
      checkQuoteVisibility();
      if (downloadFolder) {
        scanAndLoadLibrary(downloadFolder);
      }
    });
</script>
</body>
