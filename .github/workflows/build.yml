name: Windows Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0; defaults to v1.0.0 if blank)'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows x64
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag }}".Trim()
          if ($inputTag) {
            $tag = $inputTag
          } elseif ('${{ github.ref }}' -like 'refs/tags/*') {
            $tag = '${{ github.ref_name }}'
          } else {
            $pkgVer = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$pkgVer"
          }
          Write-Host "Resolved release tag: $tag"
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows x64
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGNItola-Windows
          path: dist/MAGNItola-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: MAGNItola ${{ steps.vars.outputs.tag_name }}
          files: dist/MAGNItola-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
